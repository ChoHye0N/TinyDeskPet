# DeskPet 설정 파일
# 실행 파일(DeskPet.exe)과 같은 폴더에 두면 시작할 때 읽습니다.
# 잘못된 값은 무시하고 기본값을 사용하며, deskpet.log에 경고가 남습니다.
# 형식 설명: docs/03-detailed-design/core.md §3.6

[window]
width = 320            ; 창 크기 (px), 32 ~ 2048. 모델은 이 창에 맞춰 크기가 정해짐 (T포즈는 폭≈키)
height = 340
margin_right = 40      ; 시작 위치: 작업 영역 오른쪽 끝에서 떨어진 거리 (px)
always_on_top = true   ; 항상 위에 표시

[character]
gravity = 2400         ; 중력 가속도 (px/s²)
jump_speed = 900       ; 점프 초기 속도 (px/s)
drag_threshold = 4     ; 이 거리(px) 이상 움직여야 드래그로 판정
max_fall_speed = 4000  ; 최대 낙하 속도 (px/s)

[renderer]
vsync = true           ; false면 CPU 사용률이 크게 올라갑니다 (디버깅용)
outline = model        ; 외곽선: model(모델이 지정한 재질만) / all(모든 불투명 재질) / off
msaa = 4               ; 외곽 계단 현상 제거 (1 = 끔, 2, 4, 8). 높을수록 GPU 부담 증가
# debug_layer = true   ; D3D11 디버그 레이어. 지정하지 않으면 Debug 빌드에서만 켜짐
                       ; (Windows '그래픽 도구' 선택적 기능 필요, 없으면 자동으로 끄고 진행)

[model]
# 모델 파일 경로 (실행 파일 폴더 기준 상대 경로 가능). 비우거나 로드 실패 시 슬라임 표시
# 지원 형식: .vrm / .glb / .gltf, .pmx (MMD), .fbx — 텍스처는 모델 파일과 같은 폴더 기준으로 찾음
# 모델 파일은 저장소에 없습니다: assets/README.md 참고
path = models/zmd_EM_vrm.vrm

[animation]
idle_motion = true     ; 대기 중 숨쉬기 동작. false면 대기 중 화면이 멈춰 GPU를 쉬게 함
# 동작별 모션 파일 (VRMA .vrma / VMD .vmd / FBX .fbx). 비우면 코드로 만든 동작. 반복 재생
# 모델의 기본 자세(T/A포즈)에 맞춰 자동으로 맞춤. 실행 파일 폴더 기준 상대 경로 가능
# idle_clip = models/motions/idle.vrma   ; 대기 (assets/models/motions/에 두면 같이 복사됨)
# walk_clip = models/motions/walk.vmd    ; 걷기
# dragged_clip =                     ; 끌려 다닐 때
# airborne_clip =                    ; 던져져 공중에 있을 때

[log]
level = info           ; trace / debug / info / warn / error / off
to_file = true         ; 실행 파일 옆에 deskpet.log 작성
