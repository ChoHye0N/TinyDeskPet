# =============================================================================
# CodeQL — GitHub의 정적 보안 분석. 버퍼 오버플로, 정수 오버플로, 잘못된 포인터 사용 등을
# 데이터 흐름 분석으로 찾아 Security 탭 > Code scanning 에 보고합니다.
# 공개 저장소라 무료로 실행됩니다.
# PR에서는 돌리지 않습니다: 필수 검사가 아니라 병합을 막지 못하고, PR마다 Windows 빌드를 한 번 더
# 하는 중복이라 main에 들어온 뒤 + 매주 실행으로 충분합니다.
# =============================================================================
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0"   # 매주 월요일 03:00 (KST) — 새로 추가된 분석 규칙 반영
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C/C++)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write   # 분석 결과 업로드
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual                 # 아래 빌드를 CodeQL이 관찰해 분석
          queries: security-and-quality

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ninja
        run: pip install ninja

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          cmake --preset ci-windows
          cmake --build --preset ci-windows-release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
